<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Jaihind | Portfolio</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{color-scheme:dark;--gold:#f5c04a}
*{margin:0;box-sizing:border-box}
html,body{height:100%;background:#000;overflow:hidden;font-family:Arial,sans-serif;color:#fff}
#vid{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;background:#000;z-index:1;pointer-events:none}
#vid::-webkit-media-controls{display:none!important}
#em{position:fixed;inset:0;width:100%;height:100%;z-index:40;pointer-events:none}
#intro{position:fixed;inset:0;z-index:10;background:#050302;transition:opacity 1.1s ease}
#intro.out{opacity:0;pointer-events:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.bar{position:fixed;left:0;right:0;height:calc(7vh + env(safe-area-inset-top,0px));background:#000;z-index:5}
#bt{top:0}#bb{bottom:0;height:calc(7vh + env(safe-area-inset-bottom,0px))}
#hud{position:fixed;top:calc(7vh + 16px);left:0;right:0;text-align:center;font:700 10px monospace;letter-spacing:.4em;color:var(--gold);z-index:4;opacity:.85}
#alt{position:fixed;right:5vw;bottom:calc(7vh + 16px);font:700 11px/1.5 monospace;letter-spacing:.2em;color:var(--gold);z-index:4;text-align:right}
#cap{position:fixed;left:0;right:0;bottom:calc(7vh + 15vh);padding:0 8vw;text-align:center;font:italic clamp(20px,6vw,34px)/1.25 Georgia,serif;z-index:4;opacity:0;transition:opacity .9s;text-shadow:0 2px 20px #000}
#cap.on{opacity:1}
#ui{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:#050302;transition:opacity .8s}
#ui.hide{opacity:0;pointer-events:none}
#line{width:60vw;max-width:300px;height:2px;background:#222;overflow:hidden}
#line i{display:block;height:100%;width:0;background:var(--gold);animation:ld 1.4s ease forwards}
@keyframes ld{to{width:100%}}
button{padding:14px 34px;border-radius:40px;border:1px solid var(--gold);background:rgba(0,0,0,.4);color:var(--gold);font:700 14px Arial;letter-spacing:.2em}
#go{opacity:0;animation:sh 1s 1.4s forwards}
@keyframes sh{to{opacity:1}}

#welcome{position:fixed;inset:0;z-index:30;background:#050302;opacity:0;pointer-events:none;transition:opacity 1.2s ease;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden}
#welcome.on{opacity:1;pointer-events:auto}
#glow{position:absolute;left:50%;top:50%;width:140vmax;height:140vmax;margin:-70vmax 0 0 -70vmax;background:radial-gradient(circle,rgba(255,140,30,.35) 0,rgba(255,90,10,.12) 25%,transparent 55%);opacity:0;transform:scale(.3)}
#welcome.go #glow{animation:gl 2.4s 1.5s ease-out forwards}
@keyframes gl{0%{opacity:0;transform:scale(.3)}40%{opacity:1}100%{opacity:.8;transform:scale(1)}}
#flash{position:absolute;inset:0;background:#fff;opacity:0;z-index:6;pointer-events:none}
#welcome.go #flash{animation:fl 1s 1.7s ease-out}
@keyframes fl{0%{opacity:0}8%{opacity:.95}100%{opacity:0}}
.chip{position:absolute;left:50%;top:50%;z-index:4;white-space:nowrap;font:900 clamp(22px,8vw,48px) "Arial Black",Impact,sans-serif;color:#ffe9b8;opacity:0;
 transform:translate(calc(-50% + var(--sx)),calc(-50% + var(--sy))) rotate(var(--r)) scale(1);text-shadow:0 0 20px rgba(255,150,30,.8)}
#welcome.go .chip{animation:fly 1.7s cubic-bezier(.65,0,.25,1) forwards;animation-delay:var(--d)}
@keyframes fly{
 0%{opacity:0;transform:translate(calc(-50% + var(--sx)),calc(-50% + var(--sy))) rotate(var(--r)) scale(1);filter:blur(6px)}
 20%{opacity:.95;filter:blur(0)}
 85%{opacity:1}
 100%{opacity:0;transform:translate(-50%,-50%) rotate(0deg) scale(.15);filter:blur(10px)}}
.wrap{position:relative;z-index:2;padding:0 6vw;width:100%}
.tag{font:700 clamp(10px,3vw,13px) monospace;letter-spacing:.45em;color:var(--gold);opacity:0}
#welcome.go .tag{animation:fade 1s 2s forwards}
.ln{height:2px;width:0;margin:18px auto;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
#welcome.go .ln{animation:ex 1.2s 2s ease forwards}
#welcome.go .ln.b{animation-delay:3.9s}
@keyframes ex{to{width:70vw}}
.w{font:900 clamp(40px,17vw,110px)/1 "Arial Black",Impact,sans-serif;letter-spacing:.02em;color:#fff;text-shadow:0 0 40px rgba(255,140,30,.6)}
.w2{font:900 clamp(18px,6.5vw,44px)/1.2 "Arial Black",Impact,sans-serif;letter-spacing:.18em;color:#ffe9b8;margin-top:10px}
.nm{font:900 clamp(34px,14vw,92px)/1 "Arial Black",Impact,sans-serif;letter-spacing:.06em;color:var(--gold);text-shadow:0 0 30px rgba(255,150,30,.85),0 0 80px rgba(255,90,10,.5);margin-top:6px}
.sub{font:700 clamp(10px,3vw,13px) monospace;letter-spacing:.35em;color:#ccc;margin-top:20px;opacity:0}
#welcome.go .sub{animation:fade 1s 5s forwards}
@keyframes fade{to{opacity:.9}}
.l span{display:inline-block;opacity:0;transform:translateY(70px) scale(1.6);filter:blur(16px)}
#welcome.go .l span{animation:rise .95s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes rise{to{opacity:1;transform:none;filter:blur(0)}}
.sweep{position:absolute;top:0;bottom:0;width:30vw;left:-40vw;background:linear-gradient(100deg,transparent,rgba(255,230,170,.35),transparent);transform:skewX(-18deg);z-index:3;pointer-events:none}
#welcome.go .sweep{animation:sw 1.6s 3.6s ease-in-out forwards}
@keyframes sw{to{left:130vw}}
#again{margin-top:34px;opacity:0;pointer-events:none}
#welcome.go #again{animation:fade 1s 5.8s forwards;pointer-events:auto}
</style>
</head>
<body>

    <div class="ln"></div>

<script>
(function(){
var cv=document.getElementById('c'),x=cv.getContext('2d'),W,H,D,cx,cy;
var cap=document.getElementById('cap'),an=document.getElementById('an'),ui=document.getElementById('ui');

size();addEventListener('resize',size);
var P=[];for(var i=0;i<150;i++)P.push({x:Math.random(),y:Math.random()*1200,v:Math.random(),a:Math.random()});

var oc=document.createElement('canvas'),ox=oc.getContext('2d');

function person(t,h){
  var u=h/8;

  x.beginPath();

  x.fill();
  x.fillRect(-.19*u,-3.28*u,.38*u,.48*u);
  x.beginPath();
  x.moveTo(-.25*u,-2.95*u);
  x.quadraticCurveTo(-.65*u,-3.05*u,-.95*u,-2.72*u);
  x.lineTo(-1.05*u,-1.75*u);
  x.quadraticCurveTo(-.9*u,-1.35*u,-.55*u,-1.05*u);
  x.quadraticCurveTo(0,-.82*u,.55*u,-1.05*u);
  x.quadraticCurveTo(.9*u,-1.35*u,1.05*u,-1.75*u);
  x.lineTo(.95*u,-2.72*u);
  x.quadraticCurveTo(.65*u,-3.05*u,.25*u,-2.95*u);
  x.closePath();
  x.fill();
  function limb(points,width){
    x.beginPath();
    x.moveTo(points[0],points[1]);
    x.bezierCurveTo(points[2],points[3],points[4],points[5],points[6],points[7]);
    x.lineWidth=width;
    x.stroke();
  }
  limb([-.83*u,-2.65*u,-1.55*u,-2.9*u,-1.8*u,-1.9*u,-2.35*u,-1.45*u],.42*u);
  limb([.83*u,-2.65*u,1.55*u,-2.9*u,1.8*u,-1.9*u,2.35*u,-1.45*u],.42*u);
  limb([-2.35*u,-1.45*u,-2.65*u,-1.2*u,-2.8*u,-1.05*u,-3.05*u,-.95*u],.24*u);
  limb([2.35*u,-1.45*u,2.65*u,-1.2*u,2.8*u,-1.05*u,3.05*u,-.95*u],.24*u);
  limb([-.4*u,-1.05*u,-.75*u,-.25*u,-1.05*u,.35*u,-1.4*u,1.15*u+leg*u],.57*u);
  limb([.4*u,-1.05*u,.75*u,-.25*u,1.05*u,.35*u,1.4*u,1.15*u-leg*u],.57*u);
  limb([-1.4*u,1.15*u,-1.65*u,1.75*u,-1.3*u,2.1*u,-1.05*u,2.55*u],.34*u);
  limb([1.4*u,1.15*u,1.65*u,1.75*u,1.3*u,2.1*u,1.05*u,2.55*u],.34*u);
  x.shadowColor="rgba(255,135,35,.8)";
  x.shadowBlur=9*u;
  x.strokeStyle="rgba(255,155,65,.5)";
  x.lineWidth=.045*u;
  x.beginPath();
  x.moveTo(-.8*u,-2.6*u);
  x.quadraticCurveTo(-1.1*u,-1.5*u,-.55*u,-1.05*u);
  x.stroke();
  x.restore();
}

function helix(t,I,front){
  var conv=1-sm((t-6.8)/1.3),S=7*t+1.8*t*t,k=6.283/(H*.45),Amp=W*.2*conv;
  var O=[0,3.1416,1.5,4.64],WF=[1,1,.5,.5],ST=10;
  for(var s=0;s<4;s++){var px=0,py=0;
    for(var y=-10;y<=H+10;y+=ST){
      var p=k*y+S+O[s],a=Amp*(.6+.4*Math.sin(y*.005+t*1.2)+(s>1?.15:0)),xx=cx+a*Math.sin(p)+Math.sin(y*.13+t*17+s*5)*2.5,d=.5+.5*Math.cos(p);
      if(y>-10&&((d>=.5)===front)){var wf=WF[s];
        x.strokeStyle='rgba(255,120,20,'+(.1+.16*d)*I+')';x.lineWidth=(8+26*d)*wf;x.beginPath();x.moveTo(px,py);x.lineTo(xx,y);x.stroke();
        x.strokeStyle='rgba(255,190,60,'+(.2+.35*d)*I+')';x.lineWidth=(3+9*d)*wf;x.beginPath();x.moveTo(px,py);x.lineTo(xx,y);x.stroke();
        x.strokeStyle='rgba(255,248,215,'+(.4+.6*d)*I+')';x.lineWidth=(1+3.2*d)*wf;x.beginPath();x.moveTo(px,py);x.lineTo(xx,y);x.stroke();
        if((((y/ST)|0)+s*3)%6===0){x.fillStyle='rgba(255,235,170,'+.9*I+')';x.fillRect(xx-1.5,y-1.5,3,3)}}
      px=xx;py=y}}}

function bolts(t){BT.forEach(function(b,i){var p=(t-b)/.22;if(p<0||p>1)return;var al=1-p,n=14,fromTop=i%2===0;
  var sx=cx+(rnd(i*3.1)-.5)*W*.55,sy=fromTop?-10:H+10,ex=cx+(rnd(i*7.7)-.5)*W*.1,ey=cy,pts=[[sx,sy]];
  for(var j=1;j<=n;j++){var f=j/n;pts.push([sx+(ex-sx)*f+(rnd(i*13+j+Math.floor(t*30))-.5)*W*.13*(1-f*.6),sy+(ey-sy)*f])}
  [[12,'rgba(255,170,60,'+.28*al+')'],[3,'rgba(255,252,230,'+.95*al+')']].forEach(function(L){
    x.lineWidth=L[0];x.strokeStyle=L[1];x.beginPath();pts.forEach(function(q,j){j?x.lineTo(q[0],q[1]):x.moveTo(q[0],q[1])});x.stroke()})})}

function blast(t){var tau=t-9;if(tau<0||tau>1.2)return;
  x.globalCompositeOperation='lighter';
  var R=Math.max(W*1.2*sm(tau/.45),1),a=1-sm((tau-.5)/.6),g=x.createRadialGradient(cx,cy,0,cx,cy,R);
  g.addColorStop(0,'rgba(255,255,255,'+a+')');g.addColorStop(.25,'rgba(255,225,140,'+.9*a+')');g.addColorStop(.6,'rgba(255,120,30,'+.6*a+')');g.addColorStop(1,'rgba(120,30,0,0)');
  x.fillStyle=g;x.fillRect(0,0,W,H);
  for(var r=0;r<3;r++){var rt=tau-r*.1;if(rt<0)continue;x.strokeStyle='rgba(255,235,190,'+Math.max(0,1-rt/.9)+')';x.lineWidth=14*Math.max(0,1-rt)+2;x.beginPath();x.arc(cx,cy,rt*W*2.4,0,6.283);x.stroke()}
  for(var i=0;i<90;i++){var an=rnd(i*1.7)*6.283,sp=300+rnd(i*5.3)*1500,d=sp*tau*(1-tau*.35),l=14+sp*.035,c=Math.cos(an),sn=Math.sin(an);
    x.strokeStyle='rgba(255,'+(180+rnd(i)*70|0)+',90,'+Math.max(0,1-tau/1.1)+')';x.lineWidth=1+rnd(i*9)*2.2;x.beginPath();x.moveTo(cx+c*d,cy+sn*d);x.lineTo(cx+c*(d-l),cy+sn*(d-l));x.stroke()}
  x.globalCompositeOperation='source-over'}

/* ===== IMPACT DUST DOTS ===== */
var DOTS=null;
function buildDots(){
  var c=document.createElement('canvas'),g=c.getContext('2d');
  c.width=W;c.height=H;
  g.font='900 100px "Arial Black",Impact,sans-serif';
  var fs=Math.min(100*W*.94/g.measureText('IMPACT').width,H*.3);
  g.font='900 '+fs+'px "Arial Black",Impact,sans-serif';
  g.textAlign='center';g.textBaseline='middle';g.fillStyle='#fff';
  g.fillText('IMPACT',W/2,H/2);
  var d=g.getImageData(0,0,W,H).data,gap=Math.max(4,Math.round(fs/16)),a=[];
  for(var py=0;py<H;py+=gap)for(var px=0;px<W;px+=gap){
    if(d[(py*W+px)*4+3]>128){var i=a.length,an=rnd(i*2.3)*6.283,r=W*(.5+rnd(i*4.1)*1.1);
      a.push({tx:px,ty:py,sx:W/2+Math.cos(an)*r,sy:H/2+Math.sin(an)*r*1.3,dl:rnd(i*7.7)*.5,sz:gap*(.22+rnd(i*9.1)*.2)})}}
  DOTS={w:W,h:H,list:a}}

function frame(t,dt){
  x.setTransform(D,0,0,D,0,0);x.globalCompositeOperation='source-over';x.globalAlpha=1;
  var sh=1+7*Math.pow(Math.min(t,9)/9,2);if(t>9&&t<10.4)sh=30*Math.exp(-(t-9)*3)+(t>9.9?14*(1-(t-9.9)/.4):0);
  x.save();x.translate((Math.random()-.5)*sh,(Math.random()-.5)*sh);
  x.fillStyle='#070302';x.fillRect(-20,-20,W+40,H+40);
  var I=.45+.55*sm(t/3.5),conv=1-sm((t-6.8)/1.3);
  var g=x.createRadialGradient(cx,cy,0,cx,cy,H*.8);g.addColorStop(0,'rgba(150,85,20,'+.55*I+')');g.addColorStop(1,'rgba(0,0,0,0)');
  x.fillStyle=g;x.fillRect(0,0,W,H);
  x.globalCompositeOperation='lighter';
  var sw=W*(.2+.05*Math.sin(t*2)),g2=x.createLinearGradient(cx-sw,0,cx+sw,0);
  g2.addColorStop(0,'rgba(255,170,50,0)');g2.addColorStop(.5,'rgba(255,225,150,'+.6*I+')');g2.addColorStop(1,'rgba(255,170,50,0)');
  x.fillStyle=g2;x.fillRect(cx-sw,0,sw*2,H);
  var base=600+2800*Math.pow(Math.min(t,9)/9,1.7);
  P.forEach(function(q){var v=base*(.4+q.v);q.y-=v*dt;if(q.y<-60){q.y=H+Math.random()*80;q.x=Math.random()}
    var px=cx+(q.x-.5)*W*.9*(.35+.65*conv);x.strokeStyle='rgba(255,215,140,'+(.15+.5*q.a)*I+')';x.lineWidth=1+q.a*1.6;x.beginPath();x.moveTo(px,q.y);x.lineTo(px,q.y+v*.05+6);x.stroke()});
  x.globalCompositeOperation='source-over';
  if(t<9.3)words.forEach(function(w){var p=(t-w.t0)/(w.d*.85);if(p<0||p>1)return;
    x.save();x.translate(w.cx*W+(p-.5)*W*.1,H*(1.1-1.45*p));x.rotate(-.13);var sc=.7+1.3*p;x.scale(sc,sc);
    x.globalAlpha=Math.pow(Math.sin(Math.PI*p),.7)*.9;x.font='900 '+w.fs+'px "Arial Black",Impact,sans-serif';x.textAlign='center';x.textBaseline='middle';
    if(w.o){x.lineWidth=2;x.strokeStyle='rgba(255,225,160,.9)';x.strokeText(w.t,0,0)}else{x.fillStyle=w.t==='LET GO'?'#fff':'#ffe9b8';x.fillText(w.t,0,0)}
    x.restore()});
  x.globalCompositeOperation='lighter';
  if(t<9.3)helix(t,I,false);
  var e=sm((t-7.0)/1.6)*(1-sm((t-9.3)/.8));
  if(e>0){var L=Math.max(W,H)*1.3*e,rot=t*.5;x.fillStyle='rgba(255,225,150,'+.33*e+')';
    for(var i=0;i<26;i++){var a0=rot+i*.2417;x.beginPath();x.moveTo(cx,cy);x.lineTo(cx+Math.cos(a0-.022)*L,cy+Math.sin(a0-.022)*L);x.lineTo(cx+Math.cos(a0+.022)*L,cy+Math.sin(a0+.022)*L);x.fill()}
    var gb=x.createRadialGradient(cx,cy,0,cx,cy,W*.7*e);gb.addColorStop(0,'rgba(255,255,255,'+.9*e+')');gb.addColorStop(.3,'rgba(255,210,120,'+.5*e+')');gb.addColorStop(1,'rgba(255,150,40,0)');
    x.fillStyle=gb;x.fillRect(0,0,W,H)}

function startVideo(){
  if(vstarted)return;vstarted=true;

  vid.muted=false;
  var p=vid.play();
  if(p&&p.catch)p.catch(function(){
    vid.muted=true;
    var p2=vid.play();
    if(p2&&p2.catch)p2.catch(function(){showWelcome()})});
  guard=setTimeout(function(){if(!vplaying)showWelcome()},12000)}

  if(welcomed)return;welcomed=true;
  clearTimeout(guard);

split('t1','WELCOME',2.1,.09);
